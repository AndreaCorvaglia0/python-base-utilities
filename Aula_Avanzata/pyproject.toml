[project]
name = "corso-python"
version = "2026.1"
description = "Corso di Python per chi lavora con i dati nelle utility: i notebook, i dati e le librerie del corso."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pandas>=3.0",
    "numpy>=2.0",
    "plotly>=6.0",
    "openpyxl>=3.1",
    "requests>=2.32",
    "ipykernel>=6.29",
    "nbformat>=5.10",
]

[dependency-groups]
dev = [
    "ruff>=0.8",
]

[tool.ruff]
line-length = 100
target-version = "py312"
# i notebook e corso.py restano fuori: nel corso Ruff si usa soltanto sugli script
extend-exclude = ["corso.py", "*.ipynb"]
# le cartelle degli script hanno il loro progetto: Ruff vi riconosce calcoli.py e meteo.py come file del progetto
src = [".", "Modulo_1/Script_uv_Ruff/*", "Soluzioni/Script_uv_Ruff/*"]

[tool.ruff.lint]
select = ["E", "F", "W", "I"]

# le cartelle demo/ ed esercizio/ della sezione su uv e Ruff diventano progetti a sé con `uv init`: senza questa
# esclusione uv le aggiungerebbe al progetto del corso, con lo stesso .venv, e nessuna libreria risulterebbe mancante
[tool.uv.workspace]
members = []
exclude = ["Modulo_1/Script_uv_Ruff/*"]
