[project]
name = "corso-python"
version = "2026.1"
description = "Corso di Python per chi lavora con i dati nelle utility: i notebook, i dati e le librerie del corso."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pandas>=3.0",
    "numpy>=2.0",
    "plotly>=6.0",
    "openpyxl>=3.1",
    "requests>=2.32",
    "ipykernel>=6.29",
    "nbformat>=5.10",
]

[dependency-groups]
dev = [
    "ruff>=0.8",
]

[tool.ruff]
line-length = 100
target-version = "py312"
# i notebook del corso e corso.py restano fuori: Ruff si usa sugli script, a partire da Modulo_1/Script_uv_Ruff
extend-exclude = ["corso.py", "*.ipynb"]

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
