[project]
name = "demo-spesa"
version = "0.1.0"
description = "Il conto della spesa calcolato da uno script, con un ambiente tutto suo."
requires-python = ">=3.12"
dependencies = [
    "openpyxl>=3.1.5",
    "pandas>=3.0.6",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I"]

[dependency-groups]
dev = [
    "ruff>=0.17.1",
]
